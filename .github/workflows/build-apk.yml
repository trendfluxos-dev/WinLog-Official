name: Build WinLog Official APK
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      DEVICE_API_KEY: ${{ secrets.DEVICE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check the shared device key
        run: |
          if [ -z "$DEVICE_API_KEY" ]; then
            echo "::error::Add DEVICE_API_KEY under Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Test privacy-safe diagnostics
        run: gradle testDebugUnitTest --no-daemon --stacktrace
      - name: Build the installable APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: winlog-official-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
